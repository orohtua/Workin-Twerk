name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (lint & unit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint
        run: |
          flake8

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest; fi

  build_and_push:
    name: Build and push Docker image (optional)
    runs-on: ubuntu-latest
    needs: test
    # Only attempt to run deploy on main when Docker Hub secrets are configured
    if: ${{ secrets.DOCKERHUB_USERNAME != '' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/workin-twerk:latest

  note:
    name: Deployment note
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ secrets.DOCKERHUB_USERNAME == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Notify missing secrets
        run: |
          echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN not set; Docker push skipped. To enable Docker deployment, add these repository secrets."
